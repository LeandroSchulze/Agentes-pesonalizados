<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Process Intelligence AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex items-center justify-center px-4">
    
    <div class="bg-white p-8 rounded-lg shadow-sm max-w-md w-full border border-gray-200">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded bg-blue-50 mb-4 border border-blue-100">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Crea tu espacio de trabajo</h2>
            <p class="text-sm text-slate-500 mt-2">Registra tu organización para empezar a entrenar agentes.</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm mb-6 flex items-center">
            <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-5">
            <div>
                <label for="name" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nombre de la Organización / Usuario</label>
                <input type="text" id="name" name="name" required placeholder="Ej: TechCorp S.A."
                    class="block w-full px-4 py-2.5 bg-white border border-slate-300 rounded text-sm placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition shadow-sm">
            </div>

            <div>
                <label for="email" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="nombre@empresa.com"
                    class="block w-full px-4 py-2.5 bg-white border border-slate-300 rounded text-sm placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition shadow-sm">
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    class="block w-full px-4 py-2.5 bg-white border border-slate-300 rounded text-sm placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition shadow-sm">
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded font-medium text-white bg-blue-600 hover:bg-blue-700 shadow-sm text-sm transition duration-150 ease-in-out">
                    Crear Cuenta
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-500">
                ¿Ya tienes una cuenta? 
                <a href="/login" class="font-semibold text-blue-600 hover:text-blue-700 transition duration-150 ease-in-out block mt-1 sm:inline sm:mt-0">
                    Inicia Sesión
                </a>
            </p>
        </div>
    </div>

</body>
</html>
